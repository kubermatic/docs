          - title: Kubermatic AI
            url: /products/kubermatic-ai/
            text: End idle GPUs. Securely share AI models across every team
            noArrowIcon: true
            label: New Product
            panel:
              summary: A unified AI platform for enterprises, neoclouds, and sovereign AI providers. Turn fragmented GPU infrastructure into shared AI services and maximize GPU utilization across on-prem, cloud, and sovereign environments.
              image: /img/menu/kubermatic-ai.png
              columns:
                - column:
          - title: Kubermatic KubeLB
            url: /products/kubelb/
            text: Cloud Native Multi-Tenant Load Balancing
            noArrowIcon: true
            panel:
              summary: Welcome to Kubermatic KubeLB, the next-generation application delivery platform designed for cloud-native architectures. As cloud-native have evolved, Kubermatic KubeLB offers a multi-tenancy approach to load balancing, providing seamless scalability, security, and management for distributed applications and teams.
              image: /img/menu/kubelb.jpg
              columns:
                - column:
          - title: Kubermatic Virtualization
            url: /products/kubermatic-virtualization/
            text: Seamlessly build your private cloud entirely with Kubernetes
            noArrowIcon: true
            panel:
              summary: Simplify your operations and streamline your infrastructure with a platform that integrates Kubernetes and virtualized workloads. Enjoy enhanced networking and storage capabilities to fully support your organization's cloud needs.
              image: /img/menu/kubermatic-virtualization.jpg
              columns:
                - column:
          - title: Kubermatic Developer Platform
            url: /products/kubermatic-developer-platform/
            text: Empower Developers and Accelerate Innovation
            noArrowIcon: true
            panel:
              summary: Maximize developer productivity and accelerate innovation with Kubermatic Developer Platform (KDP). Powered by Kubernetes API and based on <a href="https://www.cncf.io/projects/kcp/">CNCF Sandbox project kcp</a>, our cutting-edge internal developer platform enables the seamless creation and management of services backed by a centralized catalog.
              image: /img/menu/kubermatic-developer-platform.jpg
              columns:
                - column:
          - title: Kubermatic SecureGuard
            url: /products/kubermatic-secureguard/
            text: Protect and manage secrets with open-source transparency
            noArrowIcon: true
            panel:
              summary: KubeSG is the open-source, unified secrets management solution that simplifies security across all environments. By combining the power of OpenBao with the integration of the External Secrets Operator, it enables automated, breakage-free secret rotation and provides a developer-friendly workflow.
              image: /img/menu/kubermatic-secureguard.png
              columns:
                - column:
